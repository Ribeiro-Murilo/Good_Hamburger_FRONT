services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ApiSettings__BaseUrl=${API_BASE_URL:-http://api:8080}
    networks:
      - goodhamburger_network
    restart: unless-stopped

networks:
  goodhamburger_network:
    name: good_hamburger_api_goodhamburger_network
    external: true
